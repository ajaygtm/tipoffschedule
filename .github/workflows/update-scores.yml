name: Update NBA Scores

on:
  schedule:
    - cron: "30 7,11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update schedule scores
        run: npm run update-scores

      - name: Commit updated schedule
        run: |
          if git diff --quiet -- data/schedule/nba_schedule_25_26.json; then
            echo "No score changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule/nba_schedule_25_26.json
          git commit -m "Update NBA scores"
          git push