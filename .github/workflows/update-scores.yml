name: Update NBA Data

on:
  schedule:
    - cron: "0 5,12,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync season schedule from API
        run: npm run update-schedule

      - name: Update game scores
        run: npm run update-scores

      - name: Build playoff bracket snapshot
        run: npm run build-playoffs

      - name: Update standings
        run: npm run update-standings

      - name: Commit updated data files
        run: |
          if git diff --quiet -- data/schedule data/standings.json data/playoffs_bracket.json; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule/*.json data/standings.json data/playoffs_bracket.json
          git commit -m "Update NBA schedule, playoff bracket, scores, and standings"
          git push